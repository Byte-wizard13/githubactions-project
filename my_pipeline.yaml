name: GitHub Actions Demo

# १. ही पाईपलाईन कधी सुरू होणार? (जेव्हा कोड Push होईल)
on: [push]

jobs:
  build-and-test:
    # २. हा कोड कोणत्या कम्प्युटरवर चालणार?
    runs-on: ubuntu-latest

    # ३. काय काम करायचे आहे? (Steps)
    steps:
      - name: GitHub वरून कोड कॉपी करा
        uses: actions/checkout@v4

      - name: प्रोजेक्ट टेस्ट करा
        run: echo "Testing our code... Code is successfully tested!"

      - name: प्रोजेक्ट बिल्ड करा
        run: echo "Building our application... Build Successful!"
